[18,'C','以前對數學有興趣用 had a great interest in；現在數學令他無聊用 bores him。','分別判斷 before / now 的時間和主詞 it 的單數形式。',[7,13,25]],
[20,'C','It is five years since Grandpa died；也可說 It has been five years since Grandpa died。','die 是動作，dead 是狀態；It 要配 has，不能配 have。',[8,9]],
[21,'D','lately 連到現在：haven’t heard；結婚後搬家是已結束的過去事件：moved。','同一段對話的兩個動詞，不必用相同時態。',[7]],
[22,'C','felt touched by the story 表感受；結局 touched her heart 是主動情緒動詞，且為過去式。','分清「感到感動」與「使人感動」，也注意介系詞和時態。',[7,12,13,14]],
[24,'C（題目問錯誤句）','Do you have to...? 要答 No, I don’t.。B 是過去進行式；D 可以用完成式問經驗、過去式答具體事件。A 的數學題搭 solve problems 比 fix problems 更自然。','先圈出 WRONG；再看問句第一個助動詞。',[7,20,21]],
[25,'D','Would you mind baking...?。A 過去且已結束的轉述用 would；B 用 it is fun to...；C 用 no choice but to stop。','四個選項對應不同句型，需分別練習。',[19,22,23,24]]
];
</script><script>const $=s=>document.querySelector(s),key='grammar-garden-v1';
const fresh=()=>({stats:{},history:[],read:[]});let state=fresh(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.stats&&Array.isArray(saved.history)&&Array.isArray(saved.read))state=saved;}catch(e){storageOK=false;}
let current='home',filter='全部',session=null;
const all=units.flatMap(u=>u.qs.map(q=>({...q,unit:u.id})));
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st=q=>state.stats[q.id]||{attempts:0,correct:0,streak:0,lastWrong:false};
const mastered=u=>u.qs.every(q=>st(q).streak>=2);
const wrongs=()=>all.filter(q=>st(q).lastWrong);
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){storageOK=false;}$('#storageWarning').textContent=storageOK?'':'目前無法儲存進度；關閉網頁前請匯出紀錄。';$('#wrongBadge').textContent=wrongs().length;}
function show(html){$('#app').innerHTML=html;$('#app').setAttribute('tabindex','-1');window.scrollTo({top:0,behavior:'instant'});document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===current);b.setAttribute('aria-current',b.dataset.nav===current?'page':'false');});save();}
function go(view){current=view;session=null;if(view==='home')home();if(view==='quiz')setup();if(view==='mistakes')mistakes();if(view==='analysis')analysis();}
function stats(){const tries=all.reduce((a,q)=>a+st(q).attempts,0),correct=all.reduce((a,q)=>a+st(q).correct,0);return `<div class="stats"><div class="stat"><small>🌳 已精熟觀念</small><strong>${units.filter(mastered).length}<small> / ${units.length}</small></strong></div><div class="stat"><small>🌱 已接觸題目</small><strong>${all.filter(q=>st(q).attempts).length}<small> / ${all.length}</small></strong></div><div class="stat"><small>🎯 累計正確率</small><strong>${tries?Math.round(correct/tries*100)+'%':'—'}</strong></div><div class="stat"><small>🩹 待訂正題目</small><strong>${wrongs().length}<small> 題</small></strong></div></div>`;}
function card(u){const n=u.qs.filter(q=>st(q).streak>=2).length;return `<article class="card"><div class="card-top"><span class="emoji" aria-hidden="true">${u.emoji}</span><span class="tag">${mastered(u)?'🌳 已精熟':state.read.includes(u.id)?'🌱 已讀教材':u.group}</span></div><h3>${u.title}</h3><p class="rule-preview">${u.rule}</p><p class="mini">對應原題 ${u.refs.map(x=>'#'+x).join('、')} · 5 題練習</p><div class="track" role="progressbar" aria-label="精熟題數" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${n}"><i style="width:${n*20}%"></i></div><div class="card-bottom"><span>${n}/5 題已連續答對 2 次</span><button class="linkbtn" data-learn="${u.id}">進入學習 →</button></div></article>`;}
function home(){show(`<section class="hero"><div><span class="pill">🍃 專為你的 16 題錯題，種下新的理解</span><h1>把「還不會」，<br>慢慢種成<em>「我會了！」</em></h1><p>歡迎來到文法小森 🌼 跟著小狐狸，把英文拆成一小步、一小步。先讀懂，再練習，讓每個觀念都長出新葉子。</p><div class="actions"><button class="btn" id="continue">開始今天的學習 ↗</button><button class="btn secondary" data-nav="quiz">✏️ 直接去練習</button></div><p class="mini" style="margin:18px 0 0">📚 26 個觀念　·　✏️ 130 題原創練習　·　💚 沒有倒數壓力</p></div><div class="garden" aria-hidden="true"><div class="island"></div><span class="mascot">🦊</span><span class="float f1">🌟 A little better, every day.</span><span class="float f2">答錯也沒關係 💛</span><span class="float f3">📖 理解，比背答案更重要</span><span class="sprout s1">🌷</span><span class="sprout s2">🌿</span><span class="sprout s3">🦋</span></div></section>${stats()}<section><div class="section-head"><div><span class="eyebrow">YOUR LEARNING PATH</span><h2>今天，想探索哪一片森林？ 🌳</h2><p>建議先走「時間森林」，再練「情緒溪谷」；一次完成 1–2 個觀念就很好。</p></div><button class="linkbtn" data-nav="analysis">查看 16 題老師診斷 →</button></div><div class="filters" aria-label="觀念分類">${['全部','時間森林','情緒溪谷','句型花園','字彙小徑'].map(f=>`<button class="chip ${filter===f?'active':''}" data-filter="${f}" aria-pressed="${filter===f}">${f}</button>`).join('')}</div><div class="cards">${units.filter(u=>filter==='全部'||u.group===filter).map(card).join('')}</div></section><div class="note">🏅 <b>小森的精熟規則：</b>每一題在不同輪次連續答對 2 次，才長出一片葉子；一個觀念的 5 題都達成，就獲得精熟徽章。這是站內練習指標，建議隔天再測一次、並口頭說明理由，確認真的理解。</div><div class="actions"><button class="btn secondary" id="export">📥 匯出學習紀錄</button><button class="linkbtn" id="reset">重新開始進度</button></div>${historyHTML()}`);$('#continue').onclick=()=>lesson((units.find(u=>u.group==='時間森林'&&!mastered(u))||units.find(u=>!mastered(u))||units[0]).id);}
function lesson(id){current='home';const u=units[id];show(`<button class="breadcrumb" data-nav="home">← 返回學習地圖</button><div class="lesson-layout"><aside class="sidebar"><span class="eyebrow">${u.group}</span><h3 style="margin-top:12px">${u.emoji} ${u.title}</h3><p class="mini">對應錯題 ${u.refs.map(x=>'#'+x).join('、')}<br>閱讀約 2 分鐘 · 練習 5 題</p><div class="track"><i style="width:${u.qs.filter(q=>st(q).streak>=2).length*20}%"></i></div><p class="mini">${u.qs.filter(q=>st(q).streak>=2).length}/5 題已精熟</p><div class="siblings">${units.filter(v=>v.group===u.group).map(v=>`<button class="${v.id===id?'active':''}" data-learn="${v.id}">${v.emoji} ${v.title}</button>`).join('')}</div></aside><article class="lesson"><span class="eyebrow">LITTLE LESSON · ${String(id+1).padStart(2,'0')}</span><h1>${u.emoji} ${u.title}</h1><div class="lesson-box"><h3>🌱 先記住這個小祕訣</h3><p class="big">${u.rule}</p><div class="example">💬 ${u.example}</div><h3>🦊 小狐狸提醒你</h3><p>${u.trap}</p></div><div class="lesson-box"><h3>🔍 回頭看看原來的錯題</h3>${analysisRows.filter(r=>u.refs.includes(r[0])).map(r=>`<p><b>第 ${r[0]} 題｜${r[1]}</b><br>${r[2]}</p>`).join('')}</div><div class="lesson-box"><h3>🧠 練習前，用自己的話說一次</h3><p>「我要先找哪個線索？為什麼這個形式才符合句子？」</p><div class="steps"><span>① 👀 找時間、主詞或情境</span><span>② 🧩 套用這一課的規則</span><span>③ 💬 說出排除其他選項的理由</span></div></div><div class="actions"><button class="btn" data-start-unit="${id}">我準備好了，練習 5 題 →</button><button class="btn secondary" id="read">${state.read.includes(id)?'✓ 已標記讀完':'📖 標記已讀完'}</button></div></article></div>`);$('#read').onclick=()=>{if(!state.read.includes(id))state.read.push(id);save();lesson(id);};}
function setup(){show(`<div class="quiz-wrap"><span class="eyebrow">PRACTICE MAKES PROGRESS</span><h1>✏️ 讓觀念，變成你的超能力</h1><p class="muted">每題作答後立即看解析。沒有計時，先想清楚再選。題序與選項每輪重新排列。</p><div class="setup"><section class="card"><span class="emoji" style="align-self:start">🌱</span><h2 style="margin-top:20px">單元練習</h2><p>專心練一個觀念，一輪 5 題。每題連續答對兩次，才算站內精熟。</p><label for="unitSelect">選擇今天的觀念</label><select id="unitSelect">${units.map(u=>`<option value="${u.id}">${u.emoji} ${u.title}</option>`).join('')}</select><button class="btn" id="startSelected">開始 5 題練習 →</button></section><section class="card"><span class="emoji" style="align-self:start">🌳</span><h2 style="margin-top:20px">森林綜合挑戰</h2><p>26 題，每個觀念抽 1 題。尚未精熟與較少練過的題目會優先出現。</p><div class="note">🧭 看看自己能不能在不同句型之間，自由切換。</div><button class="btn" id="mixed">開始 26 題挑戰 →</button></section></div><div class="note">🩹 還有 ${wrongs().length} 題待訂正。<button class="linkbtn" data-nav="mistakes">前往錯題小屋 →</button><br>精熟不代表永遠不會忘。建議明天重練，並試著自己造句。</div>${historyHTML()}</div>`);$('#startSelected').onclick=()=>startUnit(Number($('#unitSelect').value));$('#mixed').onclick=()=>startMixed();}
function startUnit(id){start(units[id].qs.map(q=>({...q,unit:id})),units[id].title,'unit',id);}
function startMixed(){const selected=units.map(u=>shuffle(all.filter(q=>q.unit===u.id)).sort((a,b)=>(st(a).streak>=2)-(st(b).streak>=2)||st(a).attempts-st(b).attempts)[0]);start(selected,'森林綜合挑戰','mixed');}
function start(list,title,kind,unit=null){if(!list.length){go('mistakes');return;}current='quiz';session={list:shuffle(list),title,kind,unit,index:0,answers:[],answered:false};question();}
function question(){const s=session,q=s.list[s.index];s.answered=false;s.options=shuffle(q.options);show(`<div class="quiz-wrap"><button class="breadcrumb" id="quit">← 結束這輪，返回測驗選單</button><div class="quiz-meta"><span>${units[q.unit].emoji} ${s.title}</span><b>第 ${s.index+1} / ${s.list.length} 題</b></div><div class="progress-head"><div class="track"><i style="width:${s.index/s.list.length*100}%"></i></div><span class="mini">已答對 ${s.answers.filter(a=>a.ok).length} 題</span></div><section class="question-box"><span class="tag">${units[q.unit].title} · 原題 ${units[q.unit].refs.join('、')}</span><h1 class="question-text">${escape(q.q)}</h1><div class="options">${s.options.map((x,i)=>`<button class="option" data-answer="${i}"><span>${String.fromCharCode(65+i)}</span>${escape(x)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></section><p class="mini" style="text-align:center;margin-top:18px">🌼 不確定也可以試試看。每次作答都會留下學習足跡。</p></div>`);$('#quit').onclick=()=>{if(confirm('已回答題目的進度會保留；確定結束這輪嗎？'))go('quiz');};}
function answer(i){const s=session;if(!s||s.answered)return;s.answered=true;const q=s.list[s.index],chosen=s.options[i],ok=chosen===q.a,old=st(q);state.stats[q.id]={attempts:old.attempts+1,correct:old.correct+(ok?1:0),streak:ok?old.streak+1:0,lastWrong:!ok,lastAnswer:chosen};s.answers.push({q,chosen,ok});save();document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(s.options[j]===q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong');});$('#feedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><h3>${ok?'🌟 答對了！這片葉子正在長大。':'🦊 沒關係，抓到一個需要補強的地方！'}</h3><p><b>正確答案：${escape(q.a)}</b></p><p>${q.why}</p>${!ok?`<p class="mini">你選的是「${escape(chosen)}」。把它放回句子，比對上面的結構或情境線索。</p>`:''}<p class="mini">${ok?`這題目前連續答對 ${state.stats[q.id].streak} 次 ${state.stats[q.id].streak>=2?'🌿 已達站內精熟':'，下一輪再試一次！'}`:'已收進錯題小屋；下次答對就會移出待訂正，仍需連續答對兩次才精熟。'}</p><details><summary>📖 再看一次觀念提示</summary><p>${units[q.unit].rule}</p><p>${units[q.unit].trap}</p></details><div class="actions"><button class="btn" id="next">${s.index+1===s.list.length?'查看本輪成果 🏅':'下一題 →'}</button></div></div>`;$('#next').onclick=()=>{if(++s.index===s.list.length)finish();else question();};$('#next').focus({preventScroll:true});}
function finish(){const s=session,correct=s.answers.filter(a=>a.ok).length;s.missed=s.answers.filter(a=>!a.ok).map(a=>a.q);state.history.unshift({at:new Date().toISOString(),title:s.title,correct,total:s.list.length});state.history=state.history.slice(0,30);save();show(`<div class="quiz-wrap"><section class="lesson-box round-result"><div class="bigemoji">${correct===s.list.length?'🌳':'🌱'}</div><span class="eyebrow">ONE MORE STEP FORWARD</span><h1 style="font-size:30px">${correct===s.list.length?'這一輪，全答對了！':'完成了！每次練習都算數。'}</h1><strong class="score">${correct} / ${s.list.length}</strong><p class="muted">${s.missed.length?`還有 ${s.missed.length} 題值得再讀一次，我們一起補起來。`:'試著隔一段時間再練，看看自己還能不能說出理由。'}</p>${s.unit!==null?`<p>${mastered(units[s.unit])?'🏅 這個觀念的 5 題都已連續答對兩次！':'🌿 本觀念尚有 '+units[s.unit].qs.filter(q=>st(q).streak<2).length+' 題未連續答對兩次。'}</p>`:''}<div class="actions" style="justify-content:center">${s.missed.length?'<button class="btn" id="retryWrong">🩹 重練本輪錯題</button>':''}<button class="btn ${s.missed.length?'secondary':''}" id="again">🔄 再練完整一輪</button><button class="btn secondary" data-nav="home">回學習地圖</button></div></section><h2>🔍 本輪訂正筆記</h2>${s.answers.map(a=>`<div class="mistake"><b>${a.ok?'✅':'🌱'} ${escape(a.q.q)}</b><p class="mini">你的答案：${escape(a.chosen)} ｜ 正確答案：${escape(a.q.a)}</p><p>${a.q.why}</p><button class="linkbtn" data-learn="${a.q.unit}">回到 ${units[a.q.unit].title} →</button></div>`).join('')}</div>`);if($('#retryWrong'))$('#retryWrong').onclick=()=>start(s.missed,'本輪錯題重練','retry',s.unit);$('#again').onclick=()=>s.kind==='unit'?startUnit(s.unit):s.kind==='mixed'?startMixed():start(s.list,s.title,s.kind,s.unit);}
function mistakes(){const ws=wrongs();show(`<span class="eyebrow">A SAFE PLACE TO TRY AGAIN</span><h1>🩹 錯題小屋</h1><p class="muted">答錯的題目先住在這裡。理解後再練，答對即可移出；精熟還需要連續答對 2 次。</p>${ws.length?`<button class="btn" id="retryAll">重練全部 ${ws.length} 題 →</button>${ws.map(q=>`<article class="mistake"><span class="tag">${units[q.unit].emoji} ${units[q.unit].title}</span><h3 style="margin-top:12px">${escape(q.q)}</h3><p class="mini">上次選擇：${escape(st(q).lastAnswer)}</p><details><summary>看答案與解析</summary><p><b>${escape(q.a)}</b> · ${q.why}</p></details><button class="linkbtn" data-learn="${q.unit}">📖 先複習這個觀念 →</button></article>`).join('')}`:'<div class="empty"><div style="font-size:64px">🏡</div><h2>目前沒有待訂正的題目</h2><p class="muted">尚未練習不等於已精熟。去做一輪，讓理解開花吧！</p><button class="btn" data-nav="quiz">前往測驗挑戰 →</button></div>'}`);if($('#retryAll'))$('#retryAll').onclick=()=>start(ws,'錯題小屋挑戰','retry');}
function analysis(){show(`<span class="eyebrow">TEACHER’S NOTES</span><h1>🔎 16 題錯題，藏著哪些學習線索？</h1><p class="muted">依據提供的《綜合版國三文法練習_教師版》前 5 頁與答案表整理。沒有孩子當時的作答選項，以下是補強方向，並非對錯因的確定診斷。</p><div class="note"><b>⚠️ 先保護正確觀念，再練習</b><p>第 10 題 A 也可成立；第 12 題 C 有語意解讀空間。兩題已加註疑義，建議與出題老師確認，避免只憑答案表扣分。新練習題採明確語境，不把有爭議選項當作單一標準。</p><a class="external" href="https://dictionary.cambridge.org/grammar/british-grammar/since" target="_blank" rel="noopener">📚 延伸查核：Cambridge — since 的起點用法 ↗</a></div><div class="steps"><span>① ⏳ 時間森林<br>完成式、持續狀態、過去事件</span><span>② 🎭 情緒溪谷<br>感受、原因、動詞與搭配</span><span>③ 🧩 句型與字彙<br>先找結構，再判斷情境</span></div>${analysisRows.map(r=>`<article class="analysis-card"><h3>第 ${r[0]} 題 <span>答案：${r[1]}</span></h3><p>${r[2]}</p><p class="muted">🦊 補強提醒：${r[3]}</p><div class="inline-units">${r[4].map(id=>`<button data-learn="${id}">${units[id].emoji} ${units[id].title} →</button>`).join('')}</div></article>`).join('')}<div class="note">👨‍👩‍👧 <b>家長陪學建議：</b>每次先選 1–2 個觀念，請孩子讀例句並說明理由，再做 5 題。答錯先看解析、回教材，隔一會兒再重練。明天再測同一觀念，避免把短暫記住選項當成真正理解。</div><button class="btn" data-nav="home">開始補強 →</button>`);}
function historyHTML(){return state.history.length?`<section style="margin-top:30px"><h3>📔 最近完成的練習</h3>${state.history.slice(0,8).map(h=>`<div class="record-row"><span>${escape(h.title)}</span><span>${h.correct}/${h.total} 題 · ${new Date(h.at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')}</section>`:'';}
function exportRecord(){const data={title:'文法小森學習紀錄',exportedAt:new Date().toISOString(),masteryRule:'每題在不同輪次連續答對2次；每單元5題均達成',units:units.map(u=>({title:u.title,originalQuestions:u.refs,read:state.read.includes(u.id),mastered:mastered(u),questions:u.qs.map(q=>({question:q.q,answer:q.a,...st(q)}))})),history:state.history};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='文法小森-學習紀錄.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)go(b.dataset.nav);else if(b.dataset.filter){filter=b.dataset.filter;home();}else if(b.dataset.learn!==undefined)lesson(Number(b.dataset.learn));else if(b.dataset.startUnit!==undefined)startUnit(Number(b.dataset.startUnit));else if(b.dataset.answer!==undefined)answer(Number(b.dataset.answer));else if(b.id==='export')exportRecord();else if(b.id==='reset'&&confirm('確定清除這個瀏覽器的所有學習進度？建議先匯出紀錄。')){state=fresh();save();go('home');}});
$('.brand').onclick=e=>{e.preventDefault();go('home');};go('home');
</script></body></html>
